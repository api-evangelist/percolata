name: Percolata
description: >-
  Percolata is a Palo Alto, California predictive-analytics company that applies
  machine learning to help retailers optimize labor scheduling and marketing
  spend. Its platform forecasts hourly sales, in-store traffic, and takeout
  demand to drive staffing optimization and marketing budget allocation, with
  published claims of 4x higher forecast accuracy, 10-20% same-store sales lift,
  and a forecast-accuracy guarantee. Named customers include 7-Eleven, Uniqlo,
  and Telefonica. The company is backed by Andreessen Horowitz (a16z) and Google
  Ventures (GV). Percolata does not publish a public developer portal or REST API
  reference; its retail platform is delivered as a managed product with custom
  application integration. The percolata.com marketing site is now served by Wix,
  which provisions a live, first-party Model Context Protocol (MCP) endpoint and
  an llms.txt for agentic access to public site content.
